<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: navy;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <h1>Hello, world!</h1>
    <p>This is my styled page with JavaScript.</p>

    <button onclick="sayHello()">Click me</button>

    <script>
        function sayHello() {
            alert("Welcome to my page!");
        }
    </script>

</body>
</html>
